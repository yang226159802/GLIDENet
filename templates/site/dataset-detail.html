<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} | GLIDENet</title>
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body data-page="datasets">
    {{ nav }}
    <main class="site-main">
      <section class="page-intro">
        <div class="container">
          <h1>{{ title }}</h1>
          <p>{{ subtitle }}</p>
        </div>
      </section>

      <div class="doc-layout">
        <aside class="page-sidebar" aria-label="Dataset page sections">
          <h2>On this page</h2>
          <a href="#description">Description</a>
          <a href="#dataset-access">Dataset Access</a>
          <a href="#quick-info">Quick Info</a>
          {{ cases_nav }}
        </aside>
        <div class="doc-main">
          <section class="section">
          {{ detail_images }}
          <h2 id="description">Description</h2>
          <p>{{ description }}</p>
          </section>
          <section class="section">
          <h2 id="dataset-access">Dataset Access</h2>
          {{ open_button }}
          </section>
          {{ cases_section }}
          <section class="section">
          <h2 id="quick-info">Quick Info</h2>
          <ul class="quick-info-list">
            {{ quick_info_items }}
          </ul>
          </section>
        </div>
      </div>
    </main>
    {{ footer }}
    <script src="js/site.js"></script>
  </body>
</html>
